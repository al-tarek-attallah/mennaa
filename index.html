<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطة شحن السعادة 🔋✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            color: #333;
            padding-bottom: 50px;
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 30px;
            margin-top: 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
        }

        h1 { color: #ff5252; font-weight: 900; margin-bottom: 10px; }
        p { font-size: 1.2em; color: #555; margin-bottom: 20px; font-weight: 700; }

        /* --- قسم شحن الطاقة --- */
        .battery-container {
            width: 100%;
            height: 40px;
            background: #eee;
            border-radius: 20px;
            border: 3px solid #fff;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }

        .battery-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            transition: width 0.3s cubic-bezier(0.4, 2.08, 0.55, 0.44);
        }

        .heart-btn {
            font-size: 5em;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
            display: inline-block;
            filter: drop-shadow(0 10px 10px rgba(255, 82, 82, 0.4));
        }

        .heart-btn:active { transform: scale(0.8); }
        
        .pulse { animation: pulse 1s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* --- قسم كافيه الطوارئ --- */
        .food-menu {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .food-btn {
            background: #fff;
            border: 2px solid #ffb8b8;
            border-radius: 15px;
            padding: 10px 20px;
            font-size: 1.5em;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 184, 184, 0.4);
        }

        .food-btn:hover { background: #ffe4e4; transform: translateY(-5px); }
        
        .food-message {
            margin-top: 15px;
            font-size: 1.3em;
            color: #ff5252;
            font-weight: 700;
            min-height: 35px;
        }

        /* --- الأنيميشن للأكل والزينة --- */
        .falling-emoji {
            position: fixed;
            top: -50px;
            font-size: 3em;
            z-index: 100;
            pointer-events: none;
            animation: fall 2s ease-in forwards;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f2d74e;
            z-index: 100;
            animation: confettiFall 3s ease-in-out forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- الجزء الأول: شحن الطاقة -->
    <div class="glass-box">
        <h1>شاحن السعادة 🔋</h1>
        <p>بما إن طاقتك خلصت، اضغطي على القلب بسرعة عشان تشحني نفسك تاني!</p>
        
        <div class="battery-container">
            <div class="battery-fill" id="charge-bar"></div>
        </div>
        <h2 id="charge-text" style="color: #ff5252; margin-bottom: 10px;">0%</h2>
        
        <div class="heart-btn pulse" id="heart" onclick="chargeUp()">❤️</div>
    </div>

    <!-- الجزء الثاني: كافيه الطوارئ -->
    <div class="glass-box">
        <h1>تصبيرة لحد الخروجة 🍕☕</h1>
        <p>عشان متقعيش مننا تاني، اطلبي اللي نفسك فيه دلوقتي لحد ما ننزل:</p>
        
        <div class="food-menu">
            <button class="food-btn" onclick="orderFood('🍕', 'بيتزا لزوم الروقان والمزاج العالي!')">🍕</button>
            <button class="food-btn" onclick="orderFood('☕', 'قهوة عشان تفوقي وتفردي وشك ده!')">☕</button>
            <button class="food-btn" onclick="orderFood('🍫', 'شيكولاتة عشان هرمون السعادة يضرب!')">🍫</button>
            <button class="food-btn" onclick="orderFood('💐', 'ورد عشان إنتي قمر والبدلة كانت قمر!')">💐</button>
        </div>

        <div class="food-message" id="food-msg">اطلبي متتكسفيش!</div>
    </div>

    <script>
        // برمجة شاحن السعادة
        let chargeLevel = 0;
        const bar = document.getElementById('charge-bar');
        const text = document.getElementById('charge-text');
        const heart = document.getElementById('heart');

        function chargeUp() {
            if (chargeLevel < 100) {
                chargeLevel += 10;
                bar.style.width = chargeLevel + '%';
                text.innerText = chargeLevel + '%';
                
                // تأثير نبض سريع مع الضغط
                heart.style.transform = 'scale(1.3)';
                setTimeout(() => { heart.style.transform = 'scale(1)'; }, 100);

                if (chargeLevel === 100) {
                    text.innerText = "تم الشحن 100%.. جاهزة تكسري الدنيا! ✨";
                    heart.classList.remove('pulse');
                    fireConfetti();
                }
            }
        }

        function fireConfetti() {
            const colors = ['#ff5252', '#34ace0', '#ffb142', '#2ed573', '#706fd3'];
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const conf = document.createElement('div');
                    conf.className = 'confetti';
                    conf.style.left = Math.random() * 100 + 'vw';
                    conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(conf);
                    setTimeout(() => conf.remove(), 4000);
                }, i * 20);
            }
        }

        // برمجة كافيه الطوارئ
        function orderFood(emoji, msg) {
            // تغيير الرسالة
            const msgBox = document.getElementById('food-msg');
            msgBox.innerText = msg;
            msgBox.style.transform = 'scale(1.1)';
            setTimeout(() => msgBox.style.transform = 'scale(1)', 200);

            // إنزال الإيموجي من فوق
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const item = document.createElement('div');
                    item.className = 'falling-emoji';
                    item.innerText = emoji;
                    item.style.left = Math.random() * 80 + 10 + 'vw';
                    item.style.fontSize = (Math.random() * 2 + 2) + 'em';
                    document.body.appendChild(item);
                    
                    setTimeout(() => item.remove(), 2000);
                }, i * 150);
            }
        }
    </script>
</body>
</html>
